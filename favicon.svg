<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Логотип-атом из шапки сайта; линии и электроны крупнее, чтобы читались в 16 px -->
  <style>
    svg { color: #2446d8; --hole: #ffffff; }
    @media (prefers-color-scheme: dark) { svg { color: #8aa2ff; --hole: #0e1116; } }
    ellipse { fill: none; stroke: currentColor; stroke-width: 2.6; }
    .e { fill: var(--hole); stroke: currentColor; stroke-width: 2.2; }
    .nucleus { fill: currentColor; }
  </style>
  <ellipse cx="24" cy="24" rx="21" ry="8"/>
  <ellipse cx="24" cy="24" rx="21" ry="8" transform="rotate(60 24 24)"/>
  <ellipse cx="24" cy="24" rx="21" ry="8" transform="rotate(120 24 24)"/>
  <circle class="e" cx="24" cy="16" r="3.4"/>
  <circle class="e" cx="39.2" cy="28" r="3.4"/>
  <circle class="e" cx="8.8" cy="28" r="3.4"/>
  <circle class="nucleus" cx="24" cy="24" r="4.4"/>
</svg>
